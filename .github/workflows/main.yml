name: Build NEXORA KEY APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          test -f nexora-key-android.zip || { echo "zip missing"; exit 1; }
          mkdir -p android_project
          unzip -q nexora-key-android.zip -d android_project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: android_project
        run: gradle assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NEXORA-KEY-debug-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
